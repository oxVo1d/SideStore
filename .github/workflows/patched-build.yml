name: Build patched SideStore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build patched SideStore IPA
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Apply AFC and profile diagnostics
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          gateway_path = Path("Dependencies/minimuxer/Sources/IdeviceGateway.swift")
          gateway = gateway_path.read_text()

          helper_anchor = '''    private func safeFreeError(_ err: UnsafeMutablePointer<IdeviceFfiError>?) {'''
          helper = (
              '    private func describeError(_ err: UnsafeMutablePointer<IdeviceFfiError>) -> String {\n'
              '        let message = getErrorMessage(from: err)\n'
              '        return "code=\\(err.pointee.code), subCode=\\(err.pointee.sub_code), message=\\(message)"\n'
              '    }\n\n'
              '    private func safeFreeError(_ err: UnsafeMutablePointer<IdeviceFfiError>?) {'
          )
          assert helper_anchor in gateway
          gateway = gateway.replace(helper_anchor, helper, 1)

          misagent_replacements = (
              (
                  "let msg = self.getErrorMessage(from: installErr)",
                  "let details = self.describeError(installErr)",
              ),
              (
                  'misagent_install failed: \\(msg)',
                  'misagent_install failed: \\(details)',
              ),
              (
                  'Failed to install profile: \\(msg)',
                  'Failed to install profile: \\(details)',
              ),
          )
          for old, new in misagent_replacements:
              assert gateway.count(old) == 1, old
              gateway = gateway.replace(old, new, 1)

          function_start = gateway.index("    func yeetAppAfc(bundleId: String, ipaBytes: Data) throws {")
          body_start = gateway.index("        ) { client in\n", function_start) + len("        ) { client in\n")
          body_end = gateway.index("            defer {\n                verboseLog(\"[IdeviceGateway] yeetAppAfc() closing remote file handle\")", body_start)

          replacement = '''            func ensureDirectory(_ path: String) throws {
                              verboseLog("[IdeviceGateway] yeetAppAfc() creating directory: \\(path)")
                              let mkdirError = path.withCString { pathPtr in
                                  afc_make_directory(client, pathPtr)
                              }
                              guard let mkdirError else { return }

                              let code = mkdirError.pointee.code
                              let subCode = mkdirError.pointee.sub_code
                              let details = self.describeError(mkdirError)
                              defer { self.safeFreeError(mkdirError) }

                              // ObjectExists is expected during refreshes and repeated installs.
                              guard !(code == 106 && subCode == 16) else {
                                  verboseLog("[IdeviceGateway] yeetAppAfc() directory already exists: \\(path)")
                                  return
                              }

                              debugLog("[IdeviceGateway] yeetAppAfc() afc_make_directory failed for \\(path): \\(details)")
                              throw IdeviceGatewayError.serviceError(
                                  "Failed to create remote AFC directory \\(path): \\(details)"
                              )
                          }

                          let stagingDir = MinimuxerConstants.pkgPath
                          try ensureDirectory(stagingDir)
                          let bundleDir = "\\(stagingDir)/\\(bundleId)"
                          try ensureDirectory(bundleDir)

                          let path = "\\(bundleDir)/app.ipa"
                          var fileHandle: OpaquePointer? = nil
                          verboseLog("[IdeviceGateway] yeetAppAfc() opening remote file: \\(path)")
                          let openErr = path.withCString { pathPtr in
                              afc_file_open(client, pathPtr, AfcFopenMode(rawValue: 3), &fileHandle) // WrOnly
                          }
                          if let openErr = openErr {
                              let details = self.describeError(openErr)
                              debugLog("[IdeviceGateway] yeetAppAfc() afc_file_open failed for \\(path): \\(details)")
                              defer { self.safeFreeError(openErr) }
                              throw IdeviceGatewayError.serviceError(
                                  "Failed to open remote AFC file \\(path): \\(details)"
                              )
                          }
                          guard let fileHandle else {
                              debugLog("[IdeviceGateway] yeetAppAfc() afc_file_open returned success with nil handle for \\(path)")
                              throw IdeviceGatewayError.serviceError(
                                  "AFC returned a nil file handle for \\(path)"
                              )
                          }
          '''

          gateway = gateway[:body_start] + replacement + gateway[body_end:]

          rp_action_anchor = '''        defer {
                      verboseLog("[IdeviceGateway] performWithService(\\(serviceName)) performing cleanup")
                      cleanup(client)
                  }
                  verboseLog("[IdeviceGateway] performWithService(\\(serviceName)) executing action")'''
          rp_action_patched = '''        defer {
                      verboseLog("[IdeviceGateway] performWithService(\\(serviceName)) performing cleanup")
                      cleanup(client)
                  }
                  if serviceName == "image mounter" {
                      return try withRsdImageMounterKeepalive {
                          try action(client)
                      }
                  }
                  verboseLog("[IdeviceGateway] performWithService(\\(serviceName)) executing action")'''
          assert gateway.count(rp_action_anchor) == 1
          gateway = gateway.replace(rp_action_anchor, rp_action_patched, 1)

          tcp_action_anchor = '''        defer { cleanup(client) }

                  return try action(client)
              }

              private func performWithEitherService<T>('''
          tcp_action_patched = '''        defer { cleanup(client) }

                  if serviceName == "image mounter" {
                      return try withTcpImageMounterKeepalive(provider: provider) {
                          try action(client)
                      }
                  }
                  return try action(client)
              }

              private func withQueriedImageMounterLockdown<T>(
                  _ lockdownClient: OpaquePointer,
                  action: () throws -> T
              ) throws -> T {
                  var plistVal: plist_t? = nil
                  let valueErr = lockdownd_get_value(lockdownClient, "ProductVersion", nil, &plistVal)
                  if let valueErr {
                      let details = describeError(valueErr)
                      defer { safeFreeError(valueErr) }
                      debugLog("[IdeviceGateway] image mounter Lockdown keepalive query failed: \\(details)")
                      throw IdeviceGatewayError.serviceError(
                          "Failed to query ProductVersion for image mounter keepalive: \\(details)"
                      )
                  }
                  guard let plistVal else {
                      throw IdeviceGatewayError.serviceError(
                          "Image mounter Lockdown keepalive returned a nil ProductVersion"
                      )
                  }
                  defer { safeFreePlist(plistVal) }
                  guard let productVersion = getRustPlistString(plistVal) else {
                      throw IdeviceGatewayError.serviceError(
                          "Image mounter Lockdown keepalive returned an invalid ProductVersion"
                      )
                  }
                  debugLog("[IdeviceGateway] image mounter Lockdown keepalive active; ProductVersion=\\(productVersion)")
                  return try action()
              }

              private func withTcpImageMounterKeepalive<T>(
                  provider: OpaquePointer,
                  action: () throws -> T
              ) throws -> T {
                  var lockdownClient: OpaquePointer? = nil
                  let connectErr = lockdownd_connect(provider, &lockdownClient)
                  if let connectErr {
                      let details = describeError(connectErr)
                      defer { safeFreeError(connectErr) }
                      throw IdeviceGatewayError.serviceError(
                          "Failed to open image mounter Lockdown keepalive: \\(details)"
                      )
                  }
                  guard let lockdownClient else {
                      throw IdeviceGatewayError.noConnection
                  }
                  defer {
                      verboseLog("[IdeviceGateway] closing image mounter Lockdown keepalive after service operation")
                      lockdownd_client_free(lockdownClient)
                  }
                  return try withQueriedImageMounterLockdown(lockdownClient, action: action)
              }

              private func withRsdImageMounterKeepalive<T>(
                  action: () throws -> T
              ) throws -> T {
                  guard let adapter, let handshake else {
                      throw IdeviceGatewayError.noConnection
                  }
                  var lockdownClient: OpaquePointer? = nil
                  let connectErr = lockdownd_connect_rsd(adapter, handshake, &lockdownClient)
                  if let connectErr {
                      let details = describeError(connectErr)
                      defer { safeFreeError(connectErr) }
                      throw IdeviceGatewayError.serviceError(
                          "Failed to open RSD image mounter Lockdown keepalive: \\(details)"
                      )
                  }
                  guard let lockdownClient else {
                      throw IdeviceGatewayError.noConnection
                  }
                  defer {
                      verboseLog("[IdeviceGateway] closing RSD image mounter Lockdown keepalive after service operation")
                      lockdownd_client_free(lockdownClient)
                  }
                  return try withQueriedImageMounterLockdown(lockdownClient, action: action)
              }

              private func performWithEitherService<T>('''
          assert gateway.count(tcp_action_anchor) == 1
          gateway = gateway.replace(tcp_action_anchor, tcp_action_patched, 1)

          manual_mounter_start = gateway.index("    private func mountPersonalizedDdiIdevice(")
          manual_mounter_anchor = '''        defer { image_mounter_free(mounterClient) }

          //        if try isDeveloperDiskImageMounted'''
          manual_mounter_patched = '''        defer { image_mounter_free(mounterClient) }
                  try withTcpImageMounterKeepalive(provider: provider) {

          //        if try isDeveloperDiskImageMounted'''
          assert gateway.count(manual_mounter_anchor, manual_mounter_start) == 1
          gateway = (
              gateway[:manual_mounter_start]
              + gateway[manual_mounter_start:].replace(manual_mounter_anchor, manual_mounter_patched, 1)
          )

          manual_mounter_end = '''                    verboseLog("[IdeviceGateway] mountPersonalizedDdiIdevice() mount succeeded")
                          }
                      }
                  }
              }

              func isDDIMounted() throws -> Bool {'''
          manual_mounter_end_patched = '''                    verboseLog("[IdeviceGateway] mountPersonalizedDdiIdevice() mount succeeded")
                          }
                      }
                  }
                  }
              }

              func isDDIMounted() throws -> Bool {'''
          assert gateway.count(manual_mounter_end, manual_mounter_start) == 1
          gateway = (
              gateway[:manual_mounter_start]
              + gateway[manual_mounter_start:].replace(manual_mounter_end, manual_mounter_end_patched, 1)
          )

          heartbeat_signature = '''    func performHeartbeat(interval: UInt64, newInterval: UnsafeMutablePointer<UInt64>) throws {
                 debugLog("[IdeviceGateway] performHeartbeat() called, interval: \\(interval)")'''
          heartbeat_signature_patched = '''    func performHeartbeat(
                  interval: UInt64,
                  newInterval: UnsafeMutablePointer<UInt64>,
                  onConnected: (() -> Void)? = nil
              ) throws {
                 debugLog("[IdeviceGateway] performHeartbeat() called, interval: \\(interval)")'''
          assert gateway.count(heartbeat_signature) == 1
          gateway = gateway.replace(heartbeat_signature, heartbeat_signature_patched, 1)

          heartbeat_action = '''       ) { client in
                     verboseLog("[IdeviceGateway] performHeartbeat() calling heartbeat_get_marco")'''
          heartbeat_action_patched = '''       ) { client in
                     onConnected?()
                     debugLog("[IdeviceGateway] heartbeat client connected; waiting for Marco")
                     verboseLog("[IdeviceGateway] performHeartbeat() calling heartbeat_get_marco")'''
          heartbeat_function_start = gateway.index("    func performHeartbeat(")
          assert gateway.count(heartbeat_action, heartbeat_function_start) == 1
          gateway = (
              gateway[:heartbeat_function_start]
              + gateway[heartbeat_function_start:].replace(heartbeat_action, heartbeat_action_patched, 1)
          )

          gateway_path.write_text(gateway)

          refresh_path = Path("AltStore/Operations/RefreshAppOperation.swift")
          refresh = refresh_path.read_text()
          old_throw = "                throw MinimuxerWrapperError.profileInstall"
          new_throw = (
              '                debugLog("[RefreshAppOperation] installProvisioningProfiles failed: '
              '\\(String(reflecting: error))")\n'
              "                throw error"
          )
          assert refresh.count(old_throw) == 1
          refresh_path.write_text(refresh.replace(old_throw, new_throw, 1))

          my_apps_path = Path("AltStore/My Apps/MyAppsViewController.swift")
          my_apps = my_apps_path.read_text()
          wait_start = my_apps.index(
              "                // async-let so the for-loop below runs first, ensuring we catch didFetchSourceNotification.",
              my_apps.index("    @objc func checkForUpdates"),
          )
          wait_end = my_apps.index("                do\n                {", wait_start)
          my_apps = my_apps[:wait_start] + my_apps[wait_end:]
          old_result = "                        let (_, context) = try await result"
          new_result = (
              "                        // Await the fetch itself; waiting separately for a notification can hang forever.\n"
              "                        let (_, context) = try await AppManager.shared.fetchSources()"
          )
          assert my_apps.count(old_result) == 1
          my_apps_path.write_text(my_apps.replace(old_result, new_result, 1))

          heartbeat_path = Path("Dependencies/minimuxer/Sources/Services/HeartbeatService.swift")
          heartbeat = heartbeat_path.read_text()
          heartbeat = heartbeat.replace(
              "        var taskActive = false\n",
              "        var taskActive = false\n        var clientConnected = false\n",
              1,
          )
          heartbeat = heartbeat.replace(
              "            taskActive = true\n            return true",
              "            taskActive = true\n            clientConnected = false\n            return true",
              1,
          )
          heartbeat = heartbeat.replace(
              "        func stop() {\n            running = false\n        }",
              "        func stop() {\n            running = false\n            clientConnected = false\n        }",
              1,
          )
          terminate_anchor = '''        func terminate() {
                      taskActive = false
                      running = false
                  }'''
          terminate_patched = '''        func terminate() {
                      taskActive = false
                      running = false
                      clientConnected = false
                  }

                  func setClientConnected(_ connected: Bool) {
                      clientConnected = connected
                  }

                  func isClientConnected() -> Bool {
                      clientConnected
                  }'''
          assert heartbeat.count(terminate_anchor) == 1
          heartbeat = heartbeat.replace(terminate_anchor, terminate_patched, 1)

          heartbeat_stop_anchor = '''    static func stop() async {
                  await state.stop()
                  lastBeatSuccessful = false
                  verboseLog("[minimuxer] HeartbeatService stop requested")
              }

              private static func logIfNeeded'''
          heartbeat_stop_patched = '''    static func stop() async {
                  await state.stop()
                  lastBeatSuccessful = false
                  verboseLog("[minimuxer] HeartbeatService stop requested")
              }

              static func waitUntilConnected() async -> Bool {
                  for _ in 0..<60 {
                      if await state.isClientConnected() {
                          return true
                      }
                      try? await Task.sleep(nanoseconds: 100_000_000)
                  }
                  return await state.isClientConnected()
              }

              private static func logIfNeeded'''
          assert heartbeat.count(heartbeat_stop_anchor) == 1
          heartbeat = heartbeat.replace(heartbeat_stop_anchor, heartbeat_stop_patched, 1)

          heartbeat_call = "                try IdeviceGateway.shared.performHeartbeat(interval: currentInterval, newInterval: &newInterval)"
          heartbeat_call_patched = '''                try IdeviceGateway.shared.performHeartbeat(
                          interval: currentInterval,
                          newInterval: &newInterval,
                          onConnected: {
                              Task {
                                  await state.setClientConnected(true)
                              }
                          }
                      )'''
          assert heartbeat.count(heartbeat_call) == 1
          heartbeat = heartbeat.replace(heartbeat_call, heartbeat_call_patched, 1)
          heartbeat_catch = '''            } catch {
                          logIfNeeded("Heartbeat failed: \\(error)")'''
          heartbeat_catch_patched = '''            } catch {
                          await state.setClientConnected(false)
                          logIfNeeded("Heartbeat failed: \\(error)")'''
          assert heartbeat.count(heartbeat_catch) == 1
          heartbeat_path.write_text(heartbeat.replace(heartbeat_catch, heartbeat_catch_patched, 1))

          minimuxer_path = Path("Dependencies/minimuxer/Sources/MinimuxerImpl.swift")
          minimuxer = minimuxer_path.read_text()
          start_anchor = '''        try await restartMuxerServer()
                  
                  do {'''
          start_patched = '''        try await restartMuxerServer()

                  if !isrppairing {
                      await HeartbeatService.start()
                      if await HeartbeatService.waitUntilConnected() {
                          debugLog("[minimuxer] heartbeat transport ready before service operations")
                      } else {
                          debugLog("[minimuxer] WARN: heartbeat did not connect within 6 seconds; service operations may be reset by the device")
                      }
                  }
                  
                  do {'''
          assert minimuxer.count(start_anchor) == 1
          minimuxer = minimuxer.replace(start_anchor, start_patched, 1)
          stop_anchor = '''        MuxerService.stop()
                  // mark ready!'''
          stop_patched = '''        await HeartbeatService.stop()
                  MuxerService.stop()
                  // mark ready!'''
          assert minimuxer.count(stop_anchor) == 1
          minimuxer_path.write_text(minimuxer.replace(stop_anchor, stop_patched, 1))

          health_path = Path("AltStore/Settings/HealthCheckView.swift")
          health = health_path.read_text()
          health_sleep = "            try? await Task.sleep(nanoseconds: 1_000_000_000)"
          health_sleep_patched = (
              "            // Device checks open real services; avoid churning them every second.\n"
              "            try? await Task.sleep(nanoseconds: 5_000_000_000)"
          )
          assert health.count(health_sleep) == 1
          health_path.write_text(health.replace(health_sleep, health_sleep_patched, 1))
          PY

          git diff --check
          git -C Dependencies/minimuxer diff --check
          grep -n "AfcFopenMode(rawValue: 3)" Dependencies/minimuxer/Sources/IdeviceGateway.swift
          grep -n "image mounter Lockdown keepalive active" Dependencies/minimuxer/Sources/IdeviceGateway.swift
          grep -n "heartbeat transport ready before service operations" Dependencies/minimuxer/Sources/MinimuxerImpl.swift
          grep -n "heartbeat client connected; waiting for Marco" Dependencies/minimuxer/Sources/IdeviceGateway.swift
          grep -n "waiting separately for a notification can hang forever" "AltStore/My Apps/MyAppsViewController.swift"

      - name: Validate patched Minimuxer
        run: swift build --package-path Dependencies/minimuxer -c debug

      - name: Install build tools
        run: brew install ldid xcbeautify

      - name: Set build version
        run: |
          BASE_VERSION=$(python3 scripts/ci/workflow.py get-marketing-version)
          SHORT_COMMIT=$(git rev-parse --short HEAD)
          PATCHED_VERSION="${BASE_VERSION}-afcfix.${{ github.run_number }}+${SHORT_COMMIT}"
          python3 scripts/ci/workflow.py set-marketing-version "$PATCHED_VERSION"
          echo "PATCHED_VERSION=$PATCHED_VERSION" >> "$GITHUB_ENV"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Build SideStore
        run: |
          python3 scripts/ci/workflow.py build
          mv SideStore.ipa "SideStore-${PATCHED_VERSION}.ipa"

      - name: Upload patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-${{ env.PATCHED_VERSION }}.ipa
          path: SideStore-${{ env.PATCHED_VERSION }}.ipa
          if-no-files-found: error
